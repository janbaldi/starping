<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Starping</title>
<style>
/* A handheld console: pixel screen on top, NES-style pad below (touch), keyboard/gamepad on desktop. */
:root{--shell:#1b1a1f;--bezel:#0b0a0d;--label:#8d96a0;--a:#e0603a;--b:#b5532e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e0d11;color:#ddd;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px}
#bezel{background:var(--bezel);padding:10px 10px 6px;border-radius:8px 8px 28px 8px;box-shadow:0 0 0 2px #2a2730,0 12px 40px #000c}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#brand{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:var(--label);padding:6px 2px 0}
#brand b{color:#f2f4f6;letter-spacing:4px}
#mute{background:none;border:1px solid #3a3642;color:var(--label);font:10px monospace;letter-spacing:1px;padding:3px 7px;border-radius:4px;cursor:pointer}
#deck{display:none;width:100%;max-width:420px;justify-content:space-between;align-items:center;padding:0 6px}
.touch #deck{display:flex}
#dpad{width:150px;height:150px;position:relative;touch-action:none}
#dpad .arm{position:absolute;background:#2c2932;box-shadow:inset 0 -4px 0 #0007}
#dpad .h{left:8px;right:8px;top:52px;height:46px;border-radius:6px}
#dpad .v{top:8px;bottom:8px;left:52px;width:46px;border-radius:6px}
#dpad .hub{position:absolute;left:62px;top:62px;width:26px;height:26px;border-radius:50%;background:#232027}
#dpad .lit{position:absolute;width:46px;height:46px;border-radius:6px;background:#fff2;display:none}
#btns{display:flex;gap:14px;align-items:flex-end;transform:rotate(-18deg)}
.btn{border-radius:50%;color:#fff9;font:bold 24px monospace;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;box-shadow:inset 0 -6px 0 #0005,0 4px 0 #000}
#bbtn{width:72px;height:72px;background:var(--b);margin-bottom:-6px}
#abtn{width:84px;height:84px;background:var(--a);margin-bottom:22px}
.btn.down{transform:translateY(3px);box-shadow:inset 0 -3px 0 #0005,0 1px 0 #000}
#hint{font-size:11px;color:#6d6777;letter-spacing:1px;text-align:center;line-height:1.6}
.touch #hint{display:none}
@media (orientation:landscape) and (max-height:540px){
  #app{flex-direction:row;justify-content:space-around;gap:8px}
  .touch #deck{display:contents}
  #dpad{order:0} #bezel{order:1} #btns{order:2}
}
</style>
</head>
<body>
<div id="app">
  <div id="bezel">
    <canvas id="screen" width="192" height="224" aria-label="Starping game screen"></canvas>
    <div id="brand"><span><b>STARPING</b> MARS ARCADE</span><button id="mute" type="button">SOUND ON</button></div>
  </div>
  <div id="deck">
    <div id="dpad" aria-label="D-pad"><div class="arm h"></div><div class="arm v"></div><div class="hub"></div><div class="lit" id="lit"></div></div>
    <div id="btns"><div class="btn" id="bbtn" aria-label="B button">B</div><div class="btn" id="abtn" aria-label="A button">A</div></div>
  </div>
  <div id="hint">ARROWS / WASD move · SPACE, Z or X = A · M mute · gamepads work</div>
</div>
<script>
'use strict';
/* =====================================================================
   STARPING — Mars arcade. 60-second missions, four 15-second stages, each
   a tribute to a classic (maze chase, shooter, platformer, breakout) and a
   Lunar-Lander finale. Launch windows put everyone in the same mission.
   ===================================================================== */
const W = 192, H = 224, TOP = 16, RUN = 60, STAGE_T = 15, WINDOW_MS = 15000;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- utils (Math.random only for visuals) ---------- */
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const pad6 = n => String(Math.max(0, Math.floor(n))).padStart(6, '0');
const hit = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixHex = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };

/* ---------- daily seed (same mission worldwide) ---------- */
const today = new Date().toISOString().slice(0, 10);
const EPOCH = Date.UTC(2026, 9, 20);
const sectorNo = Math.max(1, Math.floor((Date.parse(today) - EPOCH) / 864e5) + 1);
const missionTag = String(sectorNo).padStart(3, '0');
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- storage + young-player safety ---------- */
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const BLOCK = new Set(['ASS','FUK','FUC','FCK','SEX','KKK','NIG','FAG','DIK','DIC','CUM','TIT','WTF','KYS','XXX','POO','PIS','SHT','GAY','NAZ','HOE','JEW']);
const cleanIni = v => { v = String(v || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3); return v.length === 3 && !BLOCK.has(v) ? v : '???'; };
let INI = cleanIni(store.get('sp_initials')); if (INI === '???') INI = '';
const localBest = () => Number(store.get('sp_best_' + today) || 0);

/* ---------- 3x5 pixel font ---------- */
const FONT = {
  '0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[7,1,7,4,7],'3':[7,1,3,1,7],'4':[5,5,7,1,1],'5':[7,4,7,1,7],
  '6':[7,4,7,5,7],'7':[7,1,1,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,7],
  'A':[2,5,7,5,5],'B':[6,5,6,5,6],'C':[3,4,4,4,3],'D':[6,5,5,5,6],'E':[7,4,6,4,7],'F':[7,4,6,4,4],
  'G':[3,4,5,5,3],'H':[5,5,7,5,5],'I':[7,2,2,2,7],'J':[1,1,1,5,2],'K':[5,5,6,5,5],'L':[4,4,4,4,7],
  'M':[5,7,7,5,5],'N':[6,5,5,5,5],'O':[2,5,5,5,2],'P':[6,5,6,4,4],'Q':[2,5,5,6,3],'R':[6,5,6,5,5],
  'S':[3,4,2,1,6],'T':[7,2,2,2,2],'U':[5,5,5,5,7],'V':[5,5,5,5,2],'W':[5,5,7,7,5],'X':[5,5,2,5,5],
  'Y':[5,5,2,2,2],'Z':[7,1,2,4,7],' ':[0,0,0,0,0],'!':[2,2,2,0,2],':':[0,2,0,2,0],'-':[0,0,7,0,0],
  '.':[0,0,0,0,2],'/':[1,1,2,4,4],'>':[4,2,1,2,4],'<':[1,2,4,2,1],'?':[7,1,3,0,2],'+':[0,2,7,2,0],"'":[2,2,0,0,0],'*':[5,2,7,2,5],'=':[0,7,0,7,0]
};
function text(s, x, y, col, sc = 1, align = 'l') {
  s = String(s).toUpperCase();
  const w = s.length * 4 * sc - sc;
  if (align === 'c') x = Math.round(x - w / 2); else if (align === 'r') x = Math.round(x - w);
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]]; if (!g) continue;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (g[r] & (4 >> c)) ctx.fillRect(x + i * 4 * sc + c * sc, y + r * sc, sc, sc);
  }
}

/* ---------- sprites: 1 hull 2 steel 3 ice 4 plume 5 enemy 6 white 7 gold ---------- */
const S = {
  lander: ['..1111..','.122221.','12233221','12333321','12333321','12233221','.122221.','1..11..1'],
  ship:   ['...11...','..1331..','.112211.','11222211','12222221','.1.22.1.','1..44..1','...44...'],
  astroA: ['..1111..','.133331.','.133331.','..1111..','.122221.','1.2222.1','..1..1..','.11..11.'],
  astroB: ['..1111..','.133331.','.133331.','..1111..','.122221.','1.2222.1','...11...','..1..1..'],
  landerS:['..111..','.13331.','1111111','.12221.','.1...1.','1.....1'],
  ghostA: ['..5555..','.555555.','56655665','56655665','55555555','55555555','55555555','5.5..5.5'],
  ghostB: ['..5555..','.555555.','56655665','56655665','55555555','55555555','55555555','.55..55.'],
  devilA: ['........','..5555..','.555555.','.565565.','55555555','.555555.','.5....5.','55....55'],
  devilB: ['........','..5555..','.555555.','.565565.','55555555','.555555.','..5..5..','.55..55.'],
  droneA: ['5..55..5','5.5555.5','55655655','.555555.','..5555..','.5.55.5.','5......5','........'],
  droneB: ['........','5..55..5','55555555','55655655','.555555.','..5..5..','.5....5.','........'],
  ice:    ['..3..','.333.','33633','.333.','..3..'],
  heart:  ['55.55','55555','55555','.555.','..5..'],
  anom:   ['...7...','..777..','.77677.','7766677','.77677.','..777..','...7...']
};
let COLS = {};
function spr(rows, x, y, cols = COLS, flip = false) {
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < rows.length; r++) {
    const line = rows[r];
    for (let c = 0; c < line.length; c++) {
      const ch = line[c]; if (ch === '.') continue;
      ctx.fillStyle = cols[ch] || cols['*'];
      ctx.fillRect(x + (flip ? line.length - 1 - c : c), y + r, 1, 1);
    }
  }
}
const mono = (rows, x, y, c) => spr(rows, x, y, { '*': c });

/* ---------- palettes (Mars colors, 8-bit treatment) ---------- */
const BASE = { fg: '#f2f4f6', en: '#e0603a', ac: '#bfefff', gd: '#ffc65c' };
const PAL = {
  title: { ...BASE, bg: '#0b0506', dim: '#3a1a14', sk: '#b5532e' },
  maze:  { ...BASE, bg: '#000000', dim: '#b5532e', sk: '#3d6bff' },
  storm: { ...BASE, bg: '#07040f', dim: '#2e2440', sk: '#9a6e58' },
  dash:  { ...BASE, bg: '#160807', dim: '#4a1d12', sk: '#b5532e' },
  brick: { ...BASE, bg: '#070b16', dim: '#1d2a44', sk: '#b5532e' },
  land:  { ...BASE, bg: '#000000', dim: '#2a2030', sk: '#b5532e' }
};
let P = PAL.title;

/* ---------- launch windows + seeded mission plan ---------- */
const nextWindow = () => Math.floor(Date.now() / WINDOW_MS) + 1;
const windowLabel = w => new Date(w * WINDOW_MS).toISOString().slice(11, 19) + 'Z';
function missionPlan(w) {
  const r = rng(hashStr('plan:' + today + ':' + w));
  if (window.__plan) return { ...window.__plan };   // play-test hook
  const a = ['maze', 'storm', 'dash', 'brick'];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return { keys: [a[0], a[1], a[2], 'land'], anS: Math.floor(r() * 3), anT: 4 + r() * 5, anX: 24 + r() * 140, anY: TOP + 40 + r() * 70 };
}

/* ---------- state ---------- */
const G = { mode: 'title', t: 0, overT: 0, nameMsg: '' };
let R = null;   // the current run
function newRun(w) {
  R = { win: w, plan: missionPlan(w), launchAt: w * WINDOW_MS, t: 0, stage: -1, key: null, st: 0,
    score: 0, ice: 0, hearts: 3, mult: 1, hitInStage: false, inv: 0, shake: 0, gold: false,
    ents: [], shots: [], parts: [], p: { x: 92, y: 196 }, trans: null, rng: Math.random,
    pw: { shield: 0, magnet: 0, dbl: 0, wide: 0 }, streak: 0, streakT: 0, next1up: 30, chain: 0,
    ev: [], nm: 0, hits: 0, hitIn: [], lc: 0, leader: null, link: null, linkIce: 0, landed: 0,
    anomSpawned: false, anomGone: false, over: null, peersMax: 0, scroll: 0, cdLast: 99, tickLast: 99, saved: null, crater: '' };
}
newRun(nextWindow());

/* ---------- juice ---------- */
function burst(x, y, c, n = 8) { for (let i = 0; i < n; i++) R.parts.push({ x, y, vx: rnd(-50, 50), vy: rnd(-70, 15), life: rnd(.3, .6), c }); }
function popup(txt, x, y, c = 'gd') { R.parts.push({ x: clamp(x, 14, W - 14), y, vx: 0, vy: -18, life: 1, txt, c }); }
function ev(kind) { R.ev.push(R.t); }
function addScore(v, x, y) {
  const s = Math.round(v * R.mult * (R.link ? 2 : 1));
  R.score += s;
  if (x !== undefined && s >= 50) popup('+' + s, x, y);
  return s;
}
function addIce(n, x, y) {
  R.ice += n;
  R.streak = R.streakT > 0 ? R.streak + 1 : 0; R.streakT = .9;
  if (R.link) R.linkIce += n;
  addScore(10 * n);
  if (x !== undefined) burst(x, y, 'ac', 4);
  SFX.ice(R.streak); ev('ice');
  while (R.ice >= R.next1up) { R.next1up += 30; gainHeart(); }
}
function gainHeart() { if (R.hearts < 5) R.hearts++; popup('1UP!', R.p.x + 4, R.p.y - 8, 'ac'); SFX.oneup(); ev('1up'); }
function power(k, x, y) {
  if (k === 'heart') { gainHeart(); return; }
  if (k === 'ice') { addIce(5, x, y); return; }
  R.pw[k] = k === 'shield' ? 6 : 8;
  popup({ shield: 'STAR SHIELD!', magnet: 'MAGNET!', dbl: 'TRIPLE SHOT!', wide: 'WIDE!' }[k] || 'POWER!', R.p.x + 4, R.p.y - 8, 'gd');
  SFX.power(); ev('power');
}
function hurt() {
  if (R.inv > 0 || R.pw.shield > 0 || R.trans || G.mode !== 'play') return false;
  R.hearts--; R.inv = 2.5; R.hitIn.push(R.key); R.mult = 1; R.hitInStage = true; R.hits++; R.shake = .35; R.chain = 0;
  SFX.hurt(); burst(R.p.x + 4, R.p.y + 4, 'en', 14); vibrate(60); ev('hit');
  const st = STG[R.key]; if (st.onHurt) st.onHurt();
  if (R.hearts <= 0) endMission('over');
  return true;
}
function near(e, d, lim) {
  if (e.nm || d >= lim || R.inv > 0 || R.pw.shield > 0) return;
  e.nm = true; R.nm++; ev('near'); popup('CLOSE!', R.p.x + 4, R.p.y - 8, 'ac'); SFX.whoosh(); addScore(25);
}
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
const pickR = () => R.pw.magnet > 0 ? 26 : 8;

/* tween position while the screen morphs into the next stage */
function pos(e) {
  if (!R.trans || e.fx === undefined) return [e.x, e.y];
  const tt = clamp((R.trans.t - (e.dl || 0)) / (R.trans.dur - .5), 0, 1), k = easeOutBack(tt);
  return [lerp(e.fx, e.x, k), lerp(e.fy, e.y, k)];
}
const transK = () => R.trans ? clamp(R.trans.t / R.trans.dur, 0, 1) : 1;

/* =====================================================================
   STAGES
   ===================================================================== */
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
/* --- maze helpers (procedural, mirrored, braided: loops everywhere, no dead ends) --- */
function genMaze(r) {
  const g = Array.from({ length: 26 }, () => Array(12).fill('#'));
  const CW = 6, CH = 12, seen = new Set(['5,10']), st = [[5, 10]];
  g[21][11] = '.';
  const D = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (st.length) {
    const [cx, cy] = st[st.length - 1];
    const nb = D.map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x, y]) => x >= 0 && x < CW && y >= 0 && y < CH && !seen.has(x + ',' + y));
    if (!nb.length) { st.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)];
    g[1 + 2 * cy + dy][1 + 2 * cx + dx] = '.'; g[1 + 2 * ny][1 + 2 * nx] = '.';
    seen.add(nx + ',' + ny); st.push([nx, ny]);
  }
  for (let cy = 0; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) {
    const X = 1 + 2 * cx, Y = 1 + 2 * cy; let open = 0; const closed = [];
    for (const [dx, dy] of D) {
      if (cx === CW - 1 && dx === 1) { open++; continue; }
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || ny >= CH) continue;
      if (g[Y + dy][X + dx] === '.') open++; else closed.push([X + dx, Y + dy]);
    }
    if (open <= 1 && closed.length) { const [wx, wy] = closed[Math.floor(r() * closed.length)]; g[wy][wx] = '.'; }
  }
  for (let y = 11; y <= 13; y++) for (let x = 9; x <= 11; x++) g[y][x] = '.';
  g[3][1] = 'o'; g[21][1] = 'o';
  return g.map(row => row.join('') + row.slice().reverse().join(''));
}
const mOpen = (cx, cy) => cy >= 0 && cy < 26 && cx >= 0 && cx < 24 && R.maze[cy][cx] !== '#';
function gridStep(o, dist, choose) {
  let guard = 0;
  while (dist > 0 && guard++ < 12) {
    if (o.dir < 0) { choose(o); if (o.dir < 0) break; }
    const s = Math.min(dist, 8 - o.pr); o.pr += s; dist -= s;
    if (o.pr >= 8) { o.cx += DX[o.dir]; o.cy += DY[o.dir]; o.pr = 0; choose(o); if (o.dir < 0) break; }
  }
  o.x = o.cx * 8 + (o.dir >= 0 ? DX[o.dir] * o.pr : 0);
  o.y = TOP + o.cy * 8 + (o.dir >= 0 ? DY[o.dir] * o.pr : 0);
}
function pChoose(o) {
  const w = o.want;
  if (w >= 0 && mOpen(o.cx + DX[w], o.cy + DY[w])) { o.dir = w; return; }
  if (o.dir >= 0 && mOpen(o.cx + DX[o.dir], o.cy + DY[o.dir])) return;
  o.dir = -1; o.pr = 0;
}
function gChoose(o) {
  const opts = [];
  for (let d = 0; d < 4; d++) { if (o.dir >= 0 && d === (o.dir + 2) % 4) continue; if (mOpen(o.cx + DX[d], o.cy + DY[d])) opts.push(d); }
  if (!opts.length) { const r = (o.dir + 2) % 4; o.dir = o.dir >= 0 && mOpen(o.cx + DX[r], o.cy + DY[r]) ? r : -1; return; }
  const p = R.p, fr = o.fright > 0; let best = opts[0], bv = Infinity;
  for (const d of opts) { let v = (o.cx + DX[d] - p.cx) ** 2 + (o.cy + DY[d] - p.cy) ** 2; if (fr) v = -v; v += R.rng() * o.wob; if (v < bv) { bv = v; best = d; } }
  o.dir = best;
}
function inputDir() {
  const x = IN.x, y = IN.y;
  if (Math.abs(x) < .35 && Math.abs(y) < .35) return -1;
  return Math.abs(x) > Math.abs(y) ? (x > 0 ? 0 : 2) : (y > 0 ? 1 : 3);
}
function mazeDots() {
  for (let cy = 0; cy < 26; cy++) for (let cx = 0; cx < 24; cx++) {
    const ch = R.maze[cy][cx];
    if (ch === '.' && !(cy >= 11 && cy <= 13 && cx >= 9 && cx <= 14)) R.ents.push({ type: 'dot', x: cx * 8 + 3, y: TOP + cy * 8 + 3 });
    else if (ch === 'o') R.ents.push({ type: 'pow', x: cx * 8 + 2, y: TOP + cy * 8 + 2 });
  }
}
/* --- storm helpers --- */
function mkDrone(c, r, flyIn, delay) {
  const sx = 36 + c * 30, sy = TOP + 18 + r * 14, left = (c + r) % 2 === 0;
  return { type: 'drone', sx, sy, x: flyIn ? (left ? -12 : W + 4) : sx, y: flyIn ? TOP + 70 : sy, st: flyIn ? 'in' : 'hold',
    t: -delay, dur: 1.3, x0: left ? -12 : W + 4, y0: TOP + 70, cx: W / 2 + (left ? -30 : 30), cy: TOP + 170 };
}
function stormWave(flyIn) { for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) R.ents.push(mkDrone(c, r, flyIn, flyIn ? (r * 5 + c) * .12 : 0)); }
/* --- dash helpers --- */
const GROUND = 200;
function dashGen() {
  const r = R.rng;
  while (R.genX < R.scroll + W + 60) {
    const x = R.genX, k = r();
    if (k < .22 && !R.lastPit) {

const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  if (d === 3) { NM.l[NM.i] = (NM.l[NM.i] + 1) % L; SFX.bounce(); }
  if (d === 1) { NM.l[NM.i] = (NM.l[NM.i] - 1 + L) % L; SFX.bounce(); }
  if (d === 0 && NM.i < 2) NM.i++;
  if (d === 2 && NM.i > 0) NM.i--;
  if (IN.ap) {
    if (NM.i < 2) { NM.i++; SFX.count(); return; }
    const v = NM.l.map(i => CH[i]).join('');
    if (BLOCK.has(v)) { G.nameMsg = 'PICK OTHER LETTERS'; SFX.bump(); return; }

  }

function update(dt) {
  poll();

  if (G.mode === 'title') {

  } else if (G.mode === 'name') nameUpdate(dt);
  else if (G.mode === 'count') {
    const left = Math.ceil((R.launchAt - Date.now()) / 1000);
    if (left <= 3 && left > 0 && left !== R.cdLast) { R.cdLast = left; SFX.count(); }
    if (Date.now() >= R.launchAt) { G.mode = 'play'; SFX.go(); vibrate(25); }
  } else if (G.mode === 'play') {
    R.t += dt;
    if (R.t >= RUN) { endMission('done'); }
    else {
      const i = Math.min(3, Math.floor(R.t / STAGE_T));
      if (i !== R.stage) startStage(i);

      const sec = Math.ceil(STAGE_T - (R.t % STAGE_T));

      if (sec > 3) R.tickLast = 99;

  text("TODAY'S TOP PILOTS", W / 2, 100, P.en, 1, 'c');
  drawBoard(109);
  if (golden && golden.initials) text('CRATER ' + cleanIni(golden.initials) + '-' + missionTag + ' NAMED', W / 2, 148, P.gd, 1, 'c');
  else text('ANOMALY STILL OUT THERE', W / 2, 148, P.gd, 1, 'c');
  const s = Math.ceil((nextWindow() * WINDOW_MS - Date.now()) / 1000);
  let line = 'NEXT LAUNCH IN ' + s + 'S';
  if (room) { const wait = livePilots('wait').filter(p => p.presence.w === nextWindow()).length, fly = livePilots('fly').length; if (wait) line += ' / ' + wait + ' WAITING'; if (fly) line += ' / ' + fly + ' FLYING'; }
  text(line, W / 2, 160, P.ac, 1, 'c');
  if (Math.floor(G.t * 2.5) % 2 === 0) text('PUSH A TO START', W / 2, 176, P.gd, 1, 'c');
  text(INI ? 'PILOT ' + INI + '  DOWN = CHANGE' : 'DOWN = ENTER INITIALS', W / 2, 188, '#8d96a0', 1, 'c');
}
function drawName(dt) {
  drawStars(dt, -14, 4);
  text('PILOT INITIALS', W / 2, 40, P.fg, 1, 'c');
  for (let i = 0; i < 3; i++) {
    const x = 62 + i * 26, sel = i === NM.i;
    text(CH[NM.l[i]], x + 6, 70, sel ? P.gd : P.fg, 3, 'c');
    if (sel && Math.floor(G.t * 4) % 2) { ctx.fillStyle = P.en; ctx.fillRect(x, 88, 12, 2); }
  }
  text('UP/DOWN = LETTER   A = NEXT', W / 2, 108, P.ac, 1, 'c');
  if (G.nameMsg) text(G.nameMsg, W / 2, 124, P.en, 1, 'c');
}
function drawCount(dt) {
  drawStars(dt, 0, 20);
  const left = Math.max(0, Math.ceil((R.launchAt - Date.now()) / 1000));
  text('LAUNCH WINDOW ' + windowLabel(R.win), W / 2, 26, '#8d96a0', 1, 'c');
  text(left ? String(left) : 'GO!', W / 2, 40, left <= 3 ? P.gd : P.fg, 5, 'c');
  text('TODAY ON MARS', W / 2, 76, P.en, 1, 'c');
  R.plan.keys.forEach((k, i) => { const g = STG[k]; text((i + 1) + ' ' + g.name, 52, 86 + i * 9, P.fg); text(g.year.split(' ').pop(), 150, 86 + i * 9, '#8d96a0'); });
  text('D-PAD MOVE   A = ACTION', W / 2, 128, P.ac, 1, 'c');
  text('NO HIT IN A STAGE = SCORE X2 X3 X4', W / 2, 137, '#8d96a0', 1, 'c');
  text('FLY NEXT TO A LIVE PILOT = X2', W / 2, 146, '#8d96a0', 1, 'c');
  const crew = windowPeers().map(p => cleanIni(p.presence.ini));
  text(crew.length ? 'FLYING WITH ' + crew.slice(0, 5).join(' ') : 'SOLO LAUNCH', W / 2, 162, crew.length ? P.gd : '#8d96a0', 1, 'c');
  spr(S.lander, W / 2 - 4, 186 + Math.sin(G.t * 3) * 1);
  if (left <= 3 && Math.floor(G.t * 20) % 2) { ctx.fillStyle = '#ff7a2f'; ctx.fillRect(W / 2 - 1, 195, 2, 3); }
}
function drawResults() {
  ctx.fillStyle = 'rgba(0,0,0,.82)'; ctx.fillRect(0, TOP, W, H - TOP);
  const m = R.metrics || metrics(), over = R.over && R.over.kind === 'over';
  text(over ? 'GAME OVER' : 'MISSION COMPLETE', W / 2, 22, over ? P.en : P.gd, 2, 'c');
  text('SCORE ' + pad6(R.score), W / 2, 40, P.fg, 1, 'c');
  text('ICE ' + R.ice + '   LANDINGS ' + R.landed + (R.gold ? '   ANOMALY' : ''), W / 2, 48, P.ac, 1, 'c');
  if (R.newBest) text('NEW BEST TODAY!', W / 2, 56, Math.floor(G.t * 6) % 2 ? P.gd : P.en, 1, 'c');
  if (R.crater) text(R.crater, W / 2, 64, P.gd, 1, 'c'); else if (anomNotice) text(anomNotice, W / 2, 64, '#8d96a0', 1, 'c');
  // window standings
  const wp = windowPeers().map(p => ({ ini: cleanIni(p.presence.ini), s: +p.presence.sc || 0 })).concat([{ ini: INI || 'YOU', s: R.score, me: true }]).sort((a, b) => b.s - a.s);
  text(wp.length > 1 ? 'YOUR LAUNCH WINDOW' : 'SOLO FLIGHT', W / 2, 76, P.en, 1, 'c');
  wp.slice(0, 4).forEach((r, i) => text(`${i + 1} ${r.ini} ${pad6(r.s)}`, W / 2, 84 + i * 7, r.me ? P.gd : P.fg, 1, 'c'));
  // thrill report: the numbers we tune against
  const y0 = 118;
  text('THRILL REPORT', W / 2, y0, P.en, 1, 'c');
  const ok = (good, s, y) => { text(s, 30, y, P.fg); text(good ? 'OK' : '--', 166, y, good ? P.ac : '#8d96a0', 1, 'r'); };
  ok(m.ar >= 8, 'ACTION   ' + m.ar + ' PER 10S', y0 + 9);
  ok(m.gap <= 3, 'QUIETEST ' + m.gap + 'S', y0 + 17);
  ok(m.nm >= 5, 'CLOSE CALLS ' + m.nm, y0 + 25);
  ok(m.lc >= 1 || !wp.length || wp.length < 2, 'LEAD CHANGES ' + m.lc, y0 + 33);
  text("TODAY'S TOP PILOTS", W / 2, 162, P.en, 1, 'c');
  drawBoard(170, 3);
  if (G.overT > 1.5 && Math.floor(G.t * 2.5) % 2 === 0) text('A = NEXT LAUNCH', W / 2, 200, P.gd, 1, 'c');
}

function render(dt) {
  P = palette();
  COLS = { '1': P.fg, '2': '#8d96a0', '3': P.ac, '4': '#ff7a2f', '5': P.en, '6': '#ffffff', '7': P.gd };
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  if (G.mode === 'title') { drawTitle(dt); return; }
  if (G.mode === 'name') { drawName(dt); return; }
  if (G.mode === 'count') { drawCount(dt); return; }
  if (!R.key) return;
  if (R.shake > 0) ctx.setTransform(1, 0, 0, 1, Math.round(rnd(-2, 2)), Math.round(rnd(-2, 2)));
  const st = STG[R.key];
  st.drawBg(G.mode === 'play' ? dt : 0);
  st.draw();
  drawAnom();
  drawPeers();
  const blink = R.inv > 0 && Math.floor(G.t * 14) % 2;
  if (!blink) {
    const [x, y] = pos(R.p);
    if (R.pw.shield > 0) { ctx.fillStyle = ['#ffc65c', '#e0603a', '#bfefff', '#ffffff'][Math.floor(G.t * 16) % 4]; ctx.globalAlpha = .45; ctx.fillRect(x - 2, y - 2, (R.key === 'brick' ? R.p.w : 8) + 4, 12); ctx.globalAlpha = 1; }
    st.drawPlayer(x, y);
  }
  drawParts();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (R.trans) transFx();
  hud();
  if (G.mode === 'results') drawResults();
}

// fixed 60 Hz simulation steps: the same feel on a 120 Hz phone and a slow one
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now;
  acc += dt;
  try {
    let n = 0;
    while (acc >= STEP && n < 6) { update(STEP); IN.ap = false; acc -= STEP; n++; }
    if (n === 6) acc = 0;
    render(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

/* ---------- layout ---------- */
function fit() {
  const touch = document.body.classList.contains('touch'), land = innerWidth > innerHeight && innerHeight < 540;
  let aw = innerWidth - 44, ah = innerHeight - 60;
  if (touch && !land) ah -= 175;
  if (touch && land) aw -= 330;
  let s = Math.min(aw / W, ah / H);
  s = s >= 3 ? Math.floor(s) : Math.max(1, Math.floor(s * 4) / 4);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
addEventListener('touchstart', () => { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); fit(); } }, { passive: true });
addEventListener('resize', fit);
fit();
initRoom();
initDb();
requestAnimationFrame(frame);
</script>
